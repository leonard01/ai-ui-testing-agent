name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate case schema and rejection before browser launch
        run: npm run test:unit
      - name: Run browser and structured runner tests
        run: npm test
      - name: Upload browser reports and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            run-results/
          if-no-files-found: ignore
          retention-days: 7
