name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'feat/**'
      - 'test/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Deterministic test scope'
        type: choice
        options: [full, sanity, assertions, locators, ui, generation, schema, export, compile, custom]
        default: full
      spec_files:
        description: 'Custom: space-separated tests/*.spec.ts paths'
        type: string
        default: ''
      live_groq:
        description: 'Run one live Groq generation against the local demo (uses quota)'
        type: boolean
        default: false
      token_benchmark:
        description: 'Run a four-case live token benchmark (uses quota)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Select regression scope
        env:
          TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          REQUESTED_SUITE: ${{ inputs.suite }}
          CUSTOM_SPECS: ${{ inputs.spec_files }}
        shell: bash
        run: |
          set -euo pipefail
          suite=sanity
          message="$(git show -s --format=%B "$TEST_COMMIT")"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            suite="${REQUESTED_SUITE:-full}"
          elif [[ "$EVENT" == push && ( "$REF" == refs/heads/main || "$REF" == refs/heads/feature/* ) ]] ||
               [[ "$EVENT" == pull_request && "$BASE_REF" == main ]] ||
               [[ "$message" == *"[full-regression]"* ]]; then
            suite=full
          elif [[ "$message" =~ \[test:([a-z]+)\] ]]; then
            suite="${BASH_REMATCH[1]}"
          fi
          case "$suite" in
            full|sanity|assertions|locators|ui|generation|schema|export|compile|custom) ;;
            *) echo "::error::Unknown regression suite: $suite"; exit 1 ;;
          esac
          if [[ "$suite" == custom ]]; then
            read -r -a specs <<< "$CUSTOM_SPECS"
            if [[ ${#specs[@]} -eq 0 ]]; then
              echo "::error::Specify at least one test file"; exit 1
            fi
            for spec in "${specs[@]}"; do
              if [[ ! "$spec" =~ ^tests/[a-zA-Z0-9_/-]+\.spec\.ts$ || ! -f "$spec" ]]; then
                echo "::error::Invalid test file: $spec"; exit 1
              fi
            done
            echo "CUSTOM_SPECS=${specs[*]}" >> "$GITHUB_ENV"
          fi
          echo "TEST_SUITE=$suite" >> "$GITHUB_ENV"
          echo "Regression scope: $suite" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate case schema and rejection before browser launch
        if: env.TEST_SUITE != 'compile'
        run: npm run test:unit
      - name: Install Chromium
        if: env.TEST_SUITE != 'compile'
        run: npx playwright install --with-deps chromium
      - name: Run development sanity suite
        if: env.TEST_SUITE != 'full' && env.TEST_SUITE != 'compile'
        run: npm run test:sanity
      - name: Run targeted regression
        if: env.TEST_SUITE != 'full' && env.TEST_SUITE != 'sanity' && env.TEST_SUITE != 'compile'
        shell: bash
        run: |
          set -euo pipefail
          case "$TEST_SUITE" in
            assertions) specs=(tests/search-result-assertions.spec.ts tests/browser-actions.spec.ts tests/export.spec.ts tests/discovery.spec.ts) ;;
            locators) specs=(tests/discovery.spec.ts tests/duplicate-repair.spec.ts tests/nested-navigation.spec.ts tests/browser-actions.spec.ts tests/export.spec.ts) ;;
            ui) specs=(tests/review.spec.ts tests/traceability.spec.ts tests/requirement-preservation.spec.ts) ;;
            generation) specs=(tests/incremental-regeneration.spec.ts tests/json-response-recovery.spec.ts tests/requirement-preservation.spec.ts) ;;
            schema) specs=(tests/browser-actions.spec.ts tests/discovery.spec.ts tests/export.spec.ts tests/json-response-recovery.spec.ts) ;;
            export) specs=(tests/export.spec.ts) ;;
            custom) read -r -a specs <<< "$CUSTOM_SPECS" ;;
            *) exit 1 ;;
          esac
          for spec in "${specs[@]}"; do
            [[ -f "$spec" ]] || { echo "::error::Missing suite file: $spec"; exit 1; }
          done
          npm test -- "${specs[@]}"
      - name: Run independent Playwright E2E smoke gate
        if: env.TEST_SUITE == 'full'
        run: npm run test:smoke
      - name: Run browser and structured runner tests
        if: env.TEST_SUITE == 'full'
        run: npm test
      - name: Upload browser reports and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            run-results/
            regression-history/
          if-no-files-found: ignore
          retention-days: 7

  live-groq:
    # Never expose the provider secret to PR code or automatic push jobs.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.live_groq || inputs.token_benchmark) &&
      github.repository == 'leonard01/ai-ui-testing-agent' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ui-redesign' ||
       github.ref == 'refs/heads/feat/json-response-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Chromium for live generation
        if: inputs.live_groq
        run: npx playwright install --with-deps chromium
      - name: Live generation smoke (one synthetic scenario, no execution)
        if: inputs.live_groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_RESPONSE_POLICY: json
          GROQ_REASONING_EFFORT: low
          GROQ_MAX_COMPLETION_TOKENS: '2500'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GROQ_API_KEY:-}" ]]; then
            echo "::error::Configure the GROQ_API_KEY repository secret first."
            exit 1
          fi
          mkdir -p generated/ci-live
          printf '%s\n' 'Add a task called Review report.' 'Verify that Review report is visible in the task list.' > generated/ci-live/requirements.md
          env -u GROQ_API_KEY node dist/demo/server.js > /tmp/ci-demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/health >/dev/null
          node dist/generate-cli.js generate --provider groq --base-url http://127.0.0.1:3000 --requirements generated/ci-live/requirements.md --output generated/ci-live/draft.json
          echo "Schema-validated draft generated; functional correctness requires independent review."
      - name: Live token benchmark (four matrix cases)
        if: inputs.token_benchmark && success()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_MAX_COMPLETION_TOKENS: '2500'
        run: npm run test:tokens -- --total-tests=4 --live
      - name: Upload live evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: groq-live-evidence
          path: |
            generated/ci-live/
            test-results/token-benchmarks/
          if-no-files-found: ignore
          retention-days: 7
