name: Scheduled full regression

on:
  schedule:
    # Twice daily, twelve hours apart, away from the busy start of the hour.
    - cron: '17 0 * * *'
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-full-regression
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Select active development branch and daily main baseline
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ACTIVE_BRANCH: feat/json-response-recovery
          INTEGRATION_BRANCH: feature/ui-redesign
        shell: bash
        run: |
          set -euo pipefail
          # Test the current working branch twice daily, regardless of PR status.
          # After it is merged/deleted, fall back to the integration branch.
          active="$ACTIVE_BRANCH"
          if ! sha="$(gh api "repos/$REPO/commits/$active" --jq .sha)"; then
            active="$INTEGRATION_BRANCH"
            sha="$(gh api "repos/$REPO/commits/$active" --jq .sha)"
          fi
          matrix="$(jq -cn --arg branch "$active" --arg sha "$sha" '{include:[{key:"development",label:$branch,sha:$sha}]}')"
          # Main runs once daily at 00:17 UTC, or on manual dispatch.
          if [[ "$EVENT" == workflow_dispatch || "$SCHEDULE" == '17 0 * * *' ]]; then
            main_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            matrix="$(jq -c --arg sha "$main_sha" '.include += [{key:"main",label:"main",sha:$sha}]' <<< "$matrix")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Scheduled targets:" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.include[] | "- " + .label + " (" + .sha + ")"' <<< "$matrix" >> "$GITHUB_STEP_SUMMARY"
  regression:
    needs: targets
    name: Full regression — ${{ matrix.label }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FULL_REGRESSION: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm test
      - name: Upload browser reports and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-results-${{ matrix.key }}
          path: |
            test-results/
            playwright-report/
            run-results/
            regression-history/
          if-no-files-found: ignore
          retention-days: 7
